server {
    listen 80 default_server;
    server_name _;

    root /var/www/lunch-roulette;
    index index.html;

    # React 화면: 없는 경로는 index.html로 보낸다
    location / {
        try_files $uri /index.html;
    }

    # /api/... 요청은 앞의 /api 를 떼고 APP 서버로 전달한다
    location /api/ {
        proxy_pass http://10.10.20.20:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
